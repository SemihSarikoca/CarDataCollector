services:
  # ===========================================
  # Main Data Collector Bot
  # ===========================================
  collector:
    build: .
    container_name: car-data-collector
    restart: unless-stopped
    command: ["run"]
    volumes:
      # Data storage — mirrors settings.yaml base_path: "./data" with WORKDIR /app
      - ./data:/app/data
      # Configuration
      - ./config:/app/config:ro
      # Logs
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # Database
      - DATABASE_URL=postgresql://collector:collector_pass@postgres:5432/car_collector
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Ollama (running natively on host for Metal GPU access)
      - OLLAMA_URL=http://host.docker.internal:11434
      # Cloudflare solver
      - FLARESOLVERR_URL=http://flaresolverr:8191
      # Reddit OAuth - create app at https://www.reddit.com/prefs/apps (type: script)
      # Leave empty to use unauthenticated JSON API (may get 403 from some IPs)
      - REDDIT_CLIENT_ID=
      - REDDIT_CLIENT_SECRET=
    # The image's HEALTHCHECK probes :5050/health, but the collector runs no web
    # server (that's the dashboard's job) — disable it so it isn't always unhealthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collector-net
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "1.0"

  # ===========================================
  # Web Dashboard
  # ===========================================
  dashboard:
    build: .
    container_name: car-data-dashboard
    restart: unless-stopped
    command: ["dashboard"]
    ports:
      - "5050:5050"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./src:/app/src:ro
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://collector:collector_pass@postgres:5432/car_collector
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - collector-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: car-collector-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_collector
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector_pass
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - collector-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d car_collector"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: car-collector-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - collector-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ===========================================
  # FlareSolverr (Cloudflare challenge solver)
  # ===========================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: car-collector-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    ports:
      - "8191:8191"
    networks:
      - collector-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # Ollama runs natively on the host (Metal GPU on Apple Silicon).
  # Start it with: ollama serve

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  collector-net:
    driver: bridge
