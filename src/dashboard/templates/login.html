<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarData — Access</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #070809;
  --surface:    rgba(255,255,255,0.03);
  --border:     rgba(0,230,122,0.2);
  --border-hi:  rgba(0,230,122,0.5);
  --green:      #00e67a;
  --green-dim:  rgba(0,230,122,0.08);
  --text:       #e2e8f5;
  --text-dim:   #3a4a60;
  --error:      #ff2d54;
  --display:    'Rajdhani', sans-serif;
  --mono:       'JetBrains Mono', monospace;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--mono); overflow: hidden; }

.bg-dots {
  position: fixed; inset: 0; z-index: 0;
  background-image: radial-gradient(circle, rgba(0,230,122,0.07) 1px, transparent 1px);
  background-size: 32px 32px;
  animation: dots-drift 50s linear infinite;
}
@keyframes dots-drift {
  0%   { background-position: 0 0; }
  100% { background-position: 32px 32px; }
}

.bg-fade {
  position: fixed; inset: 0; z-index: 1;
  background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 20%, var(--bg) 100%);
}

.bg-glow {
  position: fixed; z-index: 1;
  width: 520px; height: 520px;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(0,230,122,0.045) 0%, transparent 65%);
  animation: breathe 8s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
  50%       { opacity: 1;   transform: translate(-50%, -50%) scale(1.22); }
}

.stage {
  position: relative; z-index: 10;
  height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}

.card {
  width: 100%;
  max-width: 380px;
  position: relative;
  padding: 44px 40px 40px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,0.06);
  backdrop-filter: blur(16px);
  animation: card-up 0.55s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes card-up {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Four-corner bracket accents */
.card::before { content: ''; position: absolute; top: -1px;    left: -1px;  width: 14px; height: 14px; border-top: 2px solid var(--green);    border-left: 2px solid var(--green); }
.card::after  { content: ''; position: absolute; top: -1px;    right: -1px; width: 14px; height: 14px; border-top: 2px solid var(--green);    border-right: 2px solid var(--green); }
.card-bl      { position: absolute; bottom: -1px; left: -1px;  width: 14px; height: 14px; border-bottom: 2px solid var(--green); border-left: 2px solid var(--green); }
.card-br      { position: absolute; bottom: -1px; right: -1px; width: 14px; height: 14px; border-bottom: 2px solid var(--green); border-right: 2px solid var(--green); }

.scan {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--green), transparent);
  animation: scan 3s ease-in-out infinite;
  opacity: 0;
}
@keyframes scan {
  0%   { opacity: 0; transform: scaleX(0.05); }
  45%  { opacity: 0.9; transform: scaleX(1); }
  85%  { opacity: 0; transform: scaleX(1); }
  100% { opacity: 0; }
}

.hd {
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: 36px; gap: 14px;
}

.logo-mark {
  width: 56px; height: 56px;
  border: 1.5px solid rgba(0,230,122,0.35);
  background: var(--green-dim);
  display: flex; align-items: center; justify-content: center;
  animation: mark-pulse 5s ease-in-out infinite;
}
@keyframes mark-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,230,122,0); }
  50%       { box-shadow: 0 0 0 8px rgba(0,230,122,0.06); }
}
.logo-mark span {
  font-family: var(--display);
  font-size: 17px; font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--green);
}

.title {
  font-family: var(--display); font-size: 22px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--text);
  text-align: center; line-height: 1.1;
}
.subtitle {
  font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--text-dim); margin-top: -6px; text-align: center;
}

.field { margin-bottom: 20px; }
.field-label {
  display: block; font-family: var(--display); font-weight: 600;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 8px;
}
.field-wrap { position: relative; }
.field-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; stroke: var(--text-dim); fill: none;
  stroke-width: 1.5; stroke-linecap: round; pointer-events: none;
}

input[type="password"] {
  width: 100%;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text); font-family: var(--mono); font-size: 13px;
  letter-spacing: 0.1em; padding: 12px 12px 12px 36px;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  caret-color: var(--green);
}
input[type="password"]::placeholder { color: var(--text-dim); letter-spacing: 0.04em; }
input[type="password"]:focus {
  border-color: rgba(0,230,122,0.4);
  box-shadow: 0 0 0 3px rgba(0,230,122,0.06);
}

.error-msg {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--error);
  background: rgba(255,45,84,0.07); border: 1px solid rgba(255,45,84,0.2);
  padding: 9px 12px; margin-bottom: 18px;
  animation: err-in 0.3s ease both;
}
@keyframes err-in { from { opacity:0; transform:translateY(-5px); } to { opacity:1; transform:none; } }
.error-msg svg { width:13px; height:13px; flex-shrink:0; stroke:var(--error); fill:none; stroke-width:2; stroke-linecap:round; }

.btn-submit {
  width: 100%; background: var(--green); color: #040506;
  border: none; font-family: var(--display); font-size: 13px;
  font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
  padding: 14px; cursor: pointer; position: relative; overflow: hidden;
  transition: box-shadow 0.2s, transform 0.1s;
}
.btn-submit::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 55%);
  pointer-events: none;
}
.btn-submit:hover { box-shadow: 0 0 24px rgba(0,230,122,0.45), 0 0 52px rgba(0,230,122,0.14); }
.btn-submit:active { transform: scale(0.99); }

.card-footer {
  margin-top: 28px; padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: space-between;
}
.badge-row { display: flex; gap: 6px; }
.badge {
  font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-dim); border: 1px solid rgba(255,255,255,0.07);
  padding: 3px 6px; font-family: var(--display); font-weight: 600;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px rgba(0,230,122,0.7);
  animation: dot-blink 2s ease-in-out infinite;
}
@keyframes dot-blink { 0%, 100% { opacity:1; } 50% { opacity:0.25; } }

.version-line {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  font-size: 9px; letter-spacing: 0.2em; color: var(--text-dim);
  text-transform: uppercase; z-index: 20; white-space: nowrap;
  font-family: var(--display);
}
</style>
</head>
<body>

<div class="bg-dots"></div>
<div class="bg-fade"></div>
<div class="bg-glow"></div>

<div class="stage">
  <div class="card">
    <div class="card-bl"></div>
    <div class="card-br"></div>
    <div class="scan"></div>

    <div class="hd">
      <div class="logo-mark"><span>CDC</span></div>
      <div>
        <div class="title">Car Data Collector</div>
        <div class="subtitle">Pipeline Dashboard</div>
      </div>
    </div>

    <form method="POST" action="/login" autocomplete="off">
      {% if error %}
      <div class="error-msg">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>
      {% endif %}

      <div class="field">
        <label class="field-label" for="token">Access Token</label>
        <div class="field-wrap">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="token" name="token" placeholder="••••••••••••" autofocus autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit">Authenticate</button>
    </form>

    <div class="card-footer">
      <div class="badge-row">
        <span class="badge">PostgreSQL</span>
        <span class="badge">Redis</span>
        <span class="badge">Ollama</span>
      </div>
      <div class="status-dot" title="System online"></div>
    </div>
  </div>
</div>

<div class="version-line">Automotive Intelligence Pipeline &nbsp;·&nbsp; v2.0</div>

<script>
  (() => {
    {% if error %}
    const card = document.querySelector('.card');
    const s = document.createElement('style');
    s.textContent = `@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}`;
    document.head.appendChild(s);
    card.style.animation = 'card-up 0.55s cubic-bezier(0.16,1,0.3,1) both, shake 0.4s 0.55s ease both';
    {% endif %}
  })();
</script>
</body>
</html>
